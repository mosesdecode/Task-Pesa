<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="50%" stop-color="#008a38" />
      <stop offset="100%" stop-color="#004d1f" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded tile -->
  <rect width="512" height="512" rx="128" fill="#020608" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Lightning Bolt -->
  <path
    d="M 288 80 L 176 272 L 272 272 L 224 432 L 352 240 L 256 240 Z"
    fill="url(#boltGrad)"
    filter="url(#glow)"
  />

  <!-- Subtle TM text watermark in corner -->
  <text x="370" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="rgba(255, 255, 255, 0.45)">TM</text>
</svg>
